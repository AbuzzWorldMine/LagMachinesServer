monitor:
  # Как часто сервер снимает показатели TPS/MSPT.
  # 20 тиков = 1 секунда.
  sample-interval-ticks: 20

  # Как часто запускается полная проверка возможных лаг-машин.
  protection-scan-interval-seconds: 5

  # Если TPS ниже этого значения, система начинает анализировать нагрузку.
  # При TPS >= 18.0 защита не вмешивается.
  protection-start-tps: 18.0

  # Сколько последних измерений хранить для анализа динамики TPS.
  # 60 измерений при интервале 20 тиков = примерно 60 секунд истории.
  history-size: 60


tps:
  # TPS, ниже которого отправляется обычное предупреждение.
  warn-threshold: 19.0

  # TPS, ниже которого сервер считается находящимся в критическом состоянии.
  critical-threshold: 18.0

  # Минимальный TPS, при котором система может начать защитные действия.
  min-threshold: 18.0

  # Сколько измерений подряд должны показать проблему,
  # прежде чем система выполнит защитное действие.
  consecutive-checks-before-action: 3

  # Минимальное время между повторными анализами одной проблемы.
  # Защита не будет постоянно анализировать один и тот же источник.
  reanalyze-cooldown-seconds: 30


weights:
  # Вес каждого предмета, лежащего на земле.
  # Чем больше значение, тем сильнее предметы влияют на score.
  items-on-ground: 1.0

  # Вес одного моба.
  # Мобы тяжелее обычных предметов с точки зрения оценки нагрузки.
  mobs: 2.5

  # Вес одной передачи предмета через воронку.
  hopper-transfers: 1.5

  # Вес одного обновления редстоуна.
  redstone-updates: 0.4

  # Вес tile/block entity.
  tile-entities: 1.0

  # Дополнительный вес общего количества block entities.
  block-entities-total: 0.2


limits:
  # Максимальное количество предметов в одном чанке,
  # которое считается допустимым до усиления анализа.
  max-items-per-chunk: 40

  # Максимальное количество мобов в одном чанке.
  max-mobs-per-chunk: 30

  # Максимальное количество передач через воронки за окно активности.
  max-hopper-transfers-per-window: 400

  # Максимальное количество обновлений редстоуна за окно активности.
  max-redstone-updates-per-window: 600

  # Продолжительность окна, за которое считаются события активности.
  activity-window-seconds: 10


mitigation:
  # Глобально включает или отключает автоматическую защиту.
  enabled: true

  actions:
    items:
      # Разрешает очистку лишних предметов с земли.
      enabled: true

    mobs:
      # Разрешает удаление лишних мобов при обнаружении патологической активности.
      enabled: true

      # Не удалять мобов с именем.
      ignore-named: true

      # Не удалять прирученных мобов.
      ignore-tamed: true

    redstone-throttle:
      # Разрешает временно ограничивать чрезмерную активность редстоуна.
      enabled: true

      # Минимальная пауза между повторным применением ограничения редстоуна.
      cooldown-seconds: 60

    hopper-throttle:
      # Разрешает временно ограничивать чрезмерную активность воронок.
      enabled: true

      # Минимальная пауза между повторным применением ограничения воронок.
      cooldown-seconds: 60


groups:
  # Группа механизмов: редстоун, поршни, наблюдатели и другие устройства.
  MECHANISMS: "Механизмы (редстоун/поршни/раздатчики)"

  # Группа систем перемещения предметов.
  ITEM_TRANSPORT: "Перегрузка транспортировки предметов (воронки)"

  # Группа чрезмерного количества мобов.
  MOBS: "Скопление мобов"

  # Группа чрезмерного количества предметов на земле.
  ITEMS: "Скопление предметов на земле"

  # Используется, если система не смогла определить конкретную причину.
  UNKNOWN: "Неопределённая причина"


group-materials:
  MECHANISMS:
    # Основные материалы, которые относятся к механизмам.
    - REDSTONE_WIRE
    - REPEATER
    - COMPARATOR
    - OBSERVER
    - PISTON
    - STICKY_PISTON
    - DISPENSER
    - DROPPER
    - REDSTONE_TORCH
    - REDSTONE_WALL_TORCH
    - REDSTONE_BLOCK
    - LEVER
    - TRIPWIRE_HOOK

  ITEM_TRANSPORT:
    # Материалы, связанные с транспортировкой предметов.
    - HOPPER
    - HOPPER_MINECART
    - CHEST_MINECART


notify:
  # Включает сообщения о проблемах для игроков с указанным permission.
  enabled: true

  # Permission для получения уведомлений.
  permission: "awtps.notify"

  # Дополнительно дублировать уведомления в консоль.
  also-log-to-console: true

  # Сообщение при обычном падении TPS.
  # %tps% = текущее TPS.
  # %world% = мир.
  message-warn: "&8[&6LagMachinesServer&8] &e⚠ Падение TPS: &f%tps% &7(мир: %world%)"

  # Сообщение при критическом падении TPS.
  # %tps% = текущее TPS.
  message-critical: "&8[&6LagMachinesServer&8] &c⚠ Критическое падение TPS: &f%tps%"

  # Сообщение после обнаружения источника нагрузки.
  # %location% = мир и X,Y,Z.
  # %cause% = определённая причина.
  # %count% = количество применённых защитных мер.
  #
  # ВАЖНО:
  # Здесь намеренно НЕТ имени игрока.
  message-action: "&cИсточник лага: &f%location% &8| &fПричина: &6%cause% &8| &fУстранено мер: &a%count%"

  # Старый параметр для имени игрока больше не используется.
  # Оставлен пустым для совместимости со старой конфигурацией.
  message-action-unknown-player: ""


particles:
  # Показывать частицы около обнаруженного источника.
  enabled: true

  # Тип частиц Bukkit/Paper.
  type: FLAME

  # Интервал обновления частиц.
  interval-ticks: 20

  # Радиус области вокруг источника.
  radius: 3.0

  # Максимальная высота появления частиц.
  height: 2.5

  # Количество точек вокруг источника.
  points: 12

  # Скорость движения частиц.
  speed: 0.01

  # Количество частиц в одной точке.
  count: 1


messages:
  # Общий префикс сообщений плагина.
  prefix: "&8[&6LagMachinesServer&8] &r"

  # Заголовок команды TPS.
  tps-header: "&aTPS сервера:"

  # Строка отдельного значения TPS.
  # %range% = название периода.
  # %tps% = значение TPS.
  tps-line: "&7%range%: &f%tps%"

  # Среднее время одного игрового тика.
  # Чем выше MSPT, тем больше сервер нагружен.
  mspt-line: "&7Среднее время тика (MSPT): &f%mspt% мс"

  # Заголовок последнего отчёта.
  report-header: "&eПоследний отчёт о лагах:"

  # Сообщение, если проблем не было обнаружено.
  report-empty: "&7Проблем не обнаружено."

  # Одна строка найденной проблемы.
  # %location% = мир/X,Y,Z.
  # %cause% = причина.
  report-line: "&7- &f%location% &7— &6%cause%"

  # Сообщение после успешной перезагрузки конфигурации.
  reload-success: "&aКонфигурация AWtps перезагружена."

  # Сообщение при отсутствии необходимого permission.
  no-permission: "&cУ вас нет прав на это действие."


defense:
  # Экстренный режим.
  # При TPS ниже этого значения защита работает максимально жёстко.
  emergency-tps: 12.0

  thresholds:
    # Количество обновлений редстоуна за окно,
    # после которого механизм считается подозрительным.
    redstone-updates-per-window: 160

    # Количество событий поршней за окно.
    piston-events-per-window: 28

    # Количество передач воронок за окно.
    hopper-transfers-per-window: 180

    # Количество срабатываний раздатчиков/выбрасывателей за окно.
    dispenses-per-window: 80

    # Количество событий вагонеток за окно.
    minecarts-per-window: 12

    # Количество событий лодок за окно.
    boats-per-window: 12

    # Количество взаимодействий с рычагами за окно.
    lever-clicks-per-window: 45

    # Общий score, после которого источник считается лаг-машиной.
    machine-score: 160

    # Score для перехода в жёсткий режим защиты.
    hard-machine-score: 420

    # Score структуры/механизмов для определения опасной конструкции.
    structure-score: 240

    # Резкий всплеск появления мобов.
    mob-spawn-burst: 18

    # Резкий всплеск появления предметов.
    item-spawn-burst: 45

  # Сколько секунд действует обычная изоляция подозрительного источника.
  quarantine-seconds: 10

  # Сколько секунд действует жёсткая изоляция.
  hard-quarantine-seconds: 20

  # Минимальная пауза между защитными действиями.
  action-cooldown-seconds: 4

  cleanup:
    # Допустимое количество предметов в чанке
    # при обычном режиме очистки.
    safe-items-per-chunk: 48

    # Допустимое количество мобов.
    safe-mobs-per-chunk: 35

    # Допустимое количество вагонеток.
    safe-minecarts-per-chunk: 8

    # Допустимое количество лодок.
    safe-boats-per-chunk: 8

    # Более строгий лимит предметов в жёстком режиме.
    hard-items-per-chunk: 18

    # Более строгий лимит мобов.
    hard-mobs-per-chunk: 20

    # Более строгий лимит вагонеток.
    hard-minecarts-per-chunk: 3

    # Более строгий лимит лодок.
    hard-boats-per-chunk: 3


# Внутреннее отслеживание размещённых механизмов.
#
# Эта система нужна для анализа источника подозрительной активности.
# Имя игрока не выводится в чат.
# Имя игрока не записывается в lag-machines.log.
# Эти данные используются только внутренним механизмом анализа.
owner-tracking:
  # Включить внутреннее отслеживание.
  enabled: true

  # Отслеживать механизмы.
  mechanisms: true

  # Значение для случаев, когда источник невозможно определить.
  unknown-name: "неизвестно"

  # Дополнительные материалы, которые считаются потенциально опасными.
  extra-materials:
    - TNT
    - SPAWNER
    - TRIAL_SPAWNER
    - TARGET
    - REDSTONE_LAMP
    - DAYLIGHT_DETECTOR
    - SCULK_SENSOR
    - CALIBRATED_SCULK_SENSOR
    - ACTIVATOR_RAIL
    - POWERED_RAIL
    - DETECTOR_RAIL
    - RAIL
    - NOTE_BLOCK
    - TRAPPED_CHEST
    - CRAFTER
    - COPPER_BULB